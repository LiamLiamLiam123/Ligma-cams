<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ligma-cams</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  background: #0f0;
  font-family: Arial, sans-serif;
  color: #000;
}
header {
  padding: 10px;
  background: #090;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
h1 {
  margin: 0;
  text-align: center;
}
#search {
  padding: 10px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
}
/* FILTER TABS */
#filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 8px 8px 0 8px;
}
.filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 2px solid #090;
  background: #fff;
  color: #000;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.filter-btn.active {
  background: #090;
  color: #fff;
}
/* STREAM CARDS */
#stream-grid {
  padding: 8px;
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}
.stream-card {
  background: #0c0;
  border-radius: 8px;
  overflow: hidden;
}
.stream-thumb-link {
  display: block;
  text-decoration: none;
}
.stream-thumb {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  background: #000;
  overflow: hidden;
}
.stream-thumb img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.2s;
}
.stream-thumb:hover img { opacity: 0.75; }
.play-btn {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 54px; height: 54px;
  background: rgba(0,0,0,0.75);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: #fff;
  pointer-events: none;
}
.live-badge {
  position: absolute;
  top: 8px; left: 8px;
  background: #c00;
  color: #fff;
  font-size: 11px;
  font-weight: bold;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}
.stream-card .stream-label {
  padding: 7px 8px;
  font-size: 13px;
  font-weight: bold;
}
.stream-card .stream-sub {
  padding: 0 8px 8px;
  font-size: 12px;
  opacity: 0.75;
}
#grid {
  padding: 8px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 8px;
}
.cam {
  background: #0c0;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
}
.cam img {
  width: 100%;
  display: block;
  min-height: 90px;
  background: #0a0;
}
.cam div {
  padding: 6px;
  font-size: 14px;
  text-align: center;
}
#empty {
  text-align: center;
  opacity: 0.6;
  margin-top: 20px;
  display: none;
}
/* FULLSCREEN */
#fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  display: none;
  z-index: 9999;
}
#fullscreen img {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
}
#closeBtn {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10000;
  background: rgba(0,0,0,0.7);
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 18px;
  cursor: pointer;
}
@media (min-width: 768px) {
  header {
    flex-direction: row;
    align-items: center;
  }
  h1 {
    flex: 1;
    text-align: left;
  }
  #search {
    flex: 2;
  }
}
</style>
</head>
<body>
<header>
  <h1>🚦 ligma-cams</h1>
  <input id="search" placeholder="Search by location">
</header>

<div id="filters">
  <button class="filter-btn active" data-view="traffic" onclick="setView('traffic')">🚗 Traffic Cams</button>
  <button class="filter-btn" data-view="streams" onclick="setView('streams')">📺 Live Streams</button>
</div>

<div id="grid"></div>
<div id="stream-grid"></div>
<div id="empty">Loading cameras…</div>
<div id="fullscreen">
  <button id="closeBtn" onclick="closeFullscreen()">✕</button>
  <img id="fs-img" alt="Camera feed">
</div>
<script>
/* LIVE STREAMS
   type "embed" = plays inline via iframe
   type "yt"    = YouTube thumbnail → opens in new tab               */
const LIVE_STREAMS = [
  /* ── INLINE EMBEDS ── */
  {
    type: "embed",
    embedUrl: "https://camstreamer.com/embed/Z8IhXeCiHAfjQL03C2yjT2nGS7zGm9NP6w183z6j",
    label: "Sydney Harbour — WebcamSydney",
    sub: "Opera House, Harbour Bridge & Circular Quay — live 24/7"
  },
  {
    type: "embed",
    embedUrl: "https://g3.ipcamlive.com/player/player.php?alias=687a39cf71c58&skin=white&autoplay=1&mute=1&disableframecapture=1&disablestorageplayer=1&disabledownloadbutton=1&disableuserpause=1",
    label: "North Bondi Beach — Cam 1",
    sub: "Looking south along Bondi Beach — North Bondi SLSC"
  },
  {
    type: "embed",
    embedUrl: "https://g3.ipcamlive.com/player/player.php?alias=669243ec21d29&skin=white&autoplay=1&mute=1",
    label: "North Bondi Beach — Cam 2",
    sub: "Second angle — North Bondi SLSC"
  },
  /* ── YOUTUBE (thumbnail → opens YouTube) ── */
  {
    type: "yt",
    id: "SEg0VujJiFU",
    label: "Sydney Harbour Bridge & Opera House",
    sub: "Static view looking north — Sydney Live Camera"
  },
  {
    type: "yt",
    id: "7pcL-0Wo77U",
    label: "Sydney Harbour Bridge & Opera House (PTZ)",
    sub: "Moving pan-tilt-zoom cam — Sydney Live Camera"
  },
  {
    type: "yt",
    id: "5uZa3-RMFos",
    label: "WebcamSydney 1 — Harbour (~4K)",
    sub: "Opera House, Circular Quay & city skyline"
  },
  {
    type: "yt",
    id: "jshwkG1ZpP8",
    label: "WebcamSydney 2 — Harbour Panning",
    sub: "180° sweep of Sydney Harbour 24/7"
  },
  {
    type: "yt",
    id: "y6eLfuAk0Lc",
    label: "Bondi Beach",
    sub: "Ocean waves & beach — 24/7"
  },
  {
    type: "yt",
    id: "qzFP4VPZrvk",
    label: "Bondi Rescue — Live Stream",
    sub: "Action-packed beach rescues — Bondi Rescue Official"
  },
  {
    type: "yt",
    id: "KPrrWB1eo1I",
    label: "Sydney CBD Skyline — PTZ Cam",
    sub: "Harbour Bridge, Opera House & Centrepoint rotating"
  }
];

/* Try fetching the JSON directly first (GitHub raw supports CORS),
   then fall back to a proxy if it fails. */
const JSON_URL = "https://raw.githubusercontent.com/LiamLiamLiam123/cams-json/main/cams.json";
const PROXY_URL = "https://corsproxy.io/?" + encodeURIComponent(JSON_URL);

const grid       = document.getElementById("grid");
const streamGrid = document.getElementById("stream-grid");
const empty      = document.getElementById("empty");
const search     = document.getElementById("search");
const fs         = document.getElementById("fullscreen");
const fsImg      = document.getElementById("fs-img");

let cameras = [];
let fsCam   = null;
let curView = "traffic";

/* Build a cache-busted image URL via a proxy to avoid mixed-content / CORS issues on images */
function imgUrl(url) {
  return "https://corsproxy.io/?" + encodeURIComponent(url) + "&_=" + Date.now();
}

/* VIEW SWITCHER */
function setView(v) {
  curView = v;
  document.querySelectorAll(".filter-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.view === v);
  });
  if (v === "traffic") {
    streamGrid.style.display = "none";
    grid.style.display = "";
    render();
  } else {
    grid.style.display = "none";
    empty.style.display = "none";
    renderStreams();
  }
}

/* LOAD CAMERAS */
async function loadCameras() {
  empty.style.display = "block";
  empty.textContent = "Loading cameras…";

  let data = null;

  // Try direct fetch first
  try {
    const res = await fetch(JSON_URL);
    if (res.ok) {
      data = await res.json();
    }
  } catch (e) {
    // fall through to proxy
  }

  // Fall back to corsproxy.io
  if (!data) {
    try {
      const res = await fetch(PROXY_URL);
      if (res.ok) {
        data = await res.json();
      }
    } catch (e) {
      empty.textContent = "Failed to load cameras. Check your connection and try refreshing.";
      return;
    }
  }

  if (!data || !data.features) {
    empty.textContent = "Unexpected data format.";
    return;
  }

  cameras = data.features.map(f => ({
    location: f.properties.title + " — " + f.properties.view,
    url: f.properties.href
  }));

  render();
}

/* RENDER TRAFFIC GRID */
function render() {
  if (curView !== "traffic") return;
  const q = search.value.toLowerCase();
  grid.innerHTML = "";
  const filtered = cameras.filter(c =>
    c.location.toLowerCase().includes(q)
  );
  empty.style.display = filtered.length ? "none" : "block";
  if (!filtered.length) empty.textContent = q ? "No cameras match your search." : "No cameras found.";

  filtered.forEach(cam => {
    const card = document.createElement("div");
    card.className = "cam";

    const img = document.createElement("img");
    img.alt = cam.location;
    img.src = cam.url + "?_=" + Date.now();
    img.onerror = function() {
      if (!this.dataset.proxied) {
        this.dataset.proxied = "1";
        this.src = imgUrl(cam.url);
      }
    };

    const label = document.createElement("div");
    label.textContent = cam.location;

    card.appendChild(img);
    card.appendChild(label);
    card.onclick = () => openFullscreen(cam);
    grid.appendChild(card);
  });
}

/* RENDER STREAMS */
function renderStreams() {
  const q = search.value.toLowerCase();
  streamGrid.innerHTML = "";
  const filtered = LIVE_STREAMS.filter(s =>
    (s.label + " " + s.sub).toLowerCase().includes(q)
  );
  streamGrid.style.display = filtered.length ? "grid" : "none";
  empty.style.display = filtered.length ? "none" : "block";
  if (!filtered.length) empty.textContent = "No streams match your search.";

  filtered.forEach(s => {
    const card = document.createElement("div");
    card.className = "stream-card";

    if (s.type === "embed") {
      // Plays inline
      card.innerHTML = `
        <div class="stream-thumb" style="padding-top:56.25%;position:relative;background:#000;">
          <iframe
            src="${s.embedUrl}"
            style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"
            allow="autoplay; fullscreen"
            allowfullscreen
            loading="lazy"
            title="${s.label}">
          </iframe>
          <div class="live-badge" style="pointer-events:none;">&#128308; LIVE</div>
        </div>
        <div class="stream-label">&#127909; ${s.label}</div>
        <div class="stream-sub">${s.sub}</div>
      `;
    } else {
      // YouTube — thumbnail opens YouTube
      const url   = "https://www.youtube.com/watch?v=" + s.id;
      const thumb = "https://img.youtube.com/vi/" + s.id + "/mqdefault.jpg";
      card.innerHTML = `
        <a href="${url}" target="_blank" rel="noopener" class="stream-thumb-link">
          <div class="stream-thumb">
            <img src="${thumb}" alt="${s.label}" loading="lazy">
            <div class="play-btn">&#9654;</div>
            <div class="live-badge">&#128308; LIVE on YouTube</div>
          </div>
        </a>
        <div class="stream-label">&#128250; ${s.label}</div>
        <div class="stream-sub">${s.sub} — <em>opens YouTube</em></div>
      `;
    }

    streamGrid.appendChild(card);
  });
}

/* FULLSCREEN */
function openFullscreen(cam) {
  fsCam = cam;
  fs.style.display = "block";
  updateFullscreenImage();
}
function closeFullscreen() {
  fs.style.display = "none";
  fsCam = null;
}
function updateFullscreenImage() {
  if (!fsCam) return;
  const direct = fsCam.url + "?_=" + Date.now();
  fsImg.src = direct;
  fsImg.onerror = function() {
    if (!this.dataset.proxied) {
      this.dataset.proxied = "1";
      this.src = imgUrl(fsCam.url);
    }
  };
  fsImg.dataset.proxied = "";
}

/* Close fullscreen on Escape */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeFullscreen();
});

/* SEARCH */
search.addEventListener("input", () => {
  if (curView === "traffic") render();
  else renderStreams();
});

/* AUTO REFRESH EVERY 15s */
setInterval(() => {
  if (curView === "traffic") render();
  if (fsCam) updateFullscreenImage();
}, 15000);

/* INIT */
loadCameras();
</script>
</body>
</html>
